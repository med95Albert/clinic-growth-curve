// 年齡計算函數
const calculateAge = (birthDate, measureDate) => {
    const birth = new Date(birthDate);
    const measure = new Date(measureDate);
    
    let years = measure.getFullYear() - birth.getFullYear();
    let months = measure.getMonth() - birth.getMonth();
    
    if (measure.getDate() < birth.getDate()) {
        months--;
    }
    
    if (months < 0) {
        years--;
        months += 12;
    }
    
    months = months < 0 ? 0 : months;
    
    return {
        years,
        months,
        decimalAge: parseFloat((years + (months / 12)).toFixed(2))
    };
};

// 日期格式化函數
const formatDate = (date) => {
    return new Date(date).toLocaleDateString('zh-TW', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
};

// 數據驗證函數
const validateMeasurement = (birthDate, measureDate, height, weight) => {
    if (!birthDate) {
        throw new Error('請輸入出生日期');
    }

    if (!measureDate) {
        throw new Error('請輸入測量日期');
    }

    const today = new Date();
    const birthDateObj = new Date(birthDate);
    const measureDateObj = new Date(measureDate);

    if (birthDateObj > today) {
        throw new Error('出生日期不能晚於今天');
    }

    if (measureDateObj > today) {
        throw new Error('測量日期不能晚於今天');
    }

    if (measureDateObj < birthDateObj) {
        throw new Error('測量日期不能早於出生日期');
    }

    const age = calculateAge(birthDate, measureDate);
    if (age.years > 18 || (age.years === 18 && age.months > 6)) {
        throw new Error('年齡不能超過18歲6個月');
    }

    if (isNaN(height) || height < 30 || height > 200) {
        throw new Error('請輸入合理的身高數值（30-200公分）');
    }

    if (isNaN(weight) || weight < 1 || weight > 150) {
        throw new Error('請輸入合理的體重數值（1-150公斤）');
    }

    return true;
};

// 計算百分位函數
const calculatePercentile = (value, age, type, gender) => {
    const data = gender === 'male' ? boysData : girlsData;
    const percentileData = data[type];
    
    let ageIndex = ageRanges.findIndex(a => a >= age);
    if (ageIndex === -1) ageIndex = ageRanges.length - 1;
    if (ageIndex === 0) ageIndex = 1;
    
    const age1 = ageRanges[ageIndex - 1];
    const age2 = ageRanges[ageIndex];
    const ageFraction = (age - age1) / (age2 - age1);
    
    const interpolate = (data1, data2) => {
        return data1 + (data2 - data1) * ageFraction;
    };
    
    const p3 = interpolate(percentileData.p3[ageIndex - 1], percentileData.p3[ageIndex]);
    const p15 = interpolate(percentileData.p15[ageIndex - 1], percentileData.p15[ageIndex]);
    const p50 = interpolate(percentileData.p50[ageIndex - 1], percentileData.p50[ageIndex]);
    const p85 = interpolate(percentileData.p85[ageIndex - 1], percentileData.p85[ageIndex]);
    const p97 = interpolate(percentileData.p97[ageIndex - 1], percentileData.p97[ageIndex]);
    
    if (value < p3) return { percentile: '<3%', value: 3, label: '偏低' };
    if (value < p15) return { percentile: '3-15%', value: 9, label: '略低' };
    if (value < p85) return { percentile: '15-85%', value: 50, label: '正常' };
    if (value < p97) return { percentile: '85-97%', value: 91, label: '略高' };
    return { percentile: '>97%', value: 97, label: '偏高' };
};

// 反向計算：根據身高值找出對應的百分位數值（用於基因身高）
const calculatePercentileValue = (targetHeight, age, gender) => {
    const data = gender === 'male' ? boysData : girlsData;
    const heightData = data.height;
    
    let ageIndex = ageRanges.findIndex(a => a >= age);
    if (ageIndex === -1) ageIndex = ageRanges.length - 1;
    if (ageIndex === 0) ageIndex = 1;
    
    const age1 = ageRanges[ageIndex - 1];
    const age2 = ageRanges[ageIndex];
    const ageFraction = (age - age1) / (age2 - age1);
    
    const interpolate = (data1, data2) => {
        return data1 + (data2 - data1) * ageFraction;
    };
    
    const p3 = interpolate(heightData.p3[ageIndex - 1], heightData.p3[ageIndex]);
    const p15 = interpolate(heightData.p15[ageIndex - 1], heightData.p15[ageIndex]);
    const p50 = interpolate(heightData.p50[ageIndex - 1], heightData.p50[ageIndex]);
    const p85 = interpolate(heightData.p85[ageIndex - 1], heightData.p85[ageIndex]);
    const p97 = interpolate(heightData.p97[ageIndex - 1], heightData.p97[ageIndex]);
    
    // 根據目標身高落在哪個區間，線性插值計算百分位數值
    if (targetHeight <= p3) {
        return 3;
    } else if (targetHeight <= p15) {
        return 3 + (targetHeight - p3) / (p15 - p3) * 12;
    } else if (targetHeight <= p50) {
        return 15 + (targetHeight - p15) / (p50 - p15) * 35;
    } else if (targetHeight <= p85) {
        return 50 + (targetHeight - p50) / (p85 - p50) * 35;
    } else if (targetHeight <= p97) {
        return 85 + (targetHeight - p85) / (p97 - p85) * 12;
    } else {
        return 97;
    }
};

// 根據百分位數值生成整條身高曲線
const generateHeightCurveByPercentile = (percentileValue, gender) => {
    const data = gender === 'male' ? boysData : girlsData;
    const heightData = data.height;
    
    return ageRanges.map((age, index) => {
        const p3 = heightData.p3[index];
        const p15 = heightData.p15[index];
        const p50 = heightData.p50[index];
        const p85 = heightData.p85[index];
        const p97 = heightData.p97[index];
        
        let height;
        if (percentileValue <= 3) {
            height = p3;
        } else if (percentileValue <= 15) {
            height = p3 + (p15 - p3) * (percentileValue - 3) / 12;
        } else if (percentileValue <= 50) {
            height = p15 + (p50 - p15) * (percentileValue - 15) / 35;
        } else if (percentileValue <= 85) {
            height = p50 + (p85 - p50) * (percentileValue - 50) / 35;
        } else if (percentileValue <= 97) {
            height = p85 + (p97 - p85) * (percentileValue - 85) / 12;
        } else {
            height = p97;
        }
        
        return { x: age, y: height };
    });
};

// ===== 統計工具函數：百分位 ↔ z-score =====

// 百分位 → z-score（Inverse Normal CDF, Peter Acklam 近似法）
const percentileToZscore = (pPercent) => {
    const p = Math.max(0.001, Math.min(0.999, pPercent / 100));
    const a = [-3.969683028665376e+01, 2.209460984245205e+02,
               -2.759285104469687e+02, 1.383577518672690e+02,
               -3.066479806614716e+01, 2.506628277459239e+00];
    const b = [-5.447609879822406e+01, 1.615858368580409e+02,
               -1.556989798598866e+02, 6.680131188771972e+01,
               -1.328068155288572e+01];
    const c = [-7.784894002430293e-03, -3.223964580411365e-01,
               -2.400758277161838e+00, -2.549732539343734e+00,
                4.374664141464968e+00, 2.938163982698783e+00];
    const d = [7.784695709041462e-03, 3.224671290700398e-01,
               2.445134137142996e+00, 3.754408661907416e+00];
    const pLow = 0.02425;
    const pHigh = 1 - pLow;
    let q, r;
    if (p < pLow) {
        q = Math.sqrt(-2 * Math.log(p));
        return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
               ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    } else if (p <= pHigh) {
        q = p - 0.5;
        r = q * q;
        return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q /
               (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
    } else {
        q = Math.sqrt(-2 * Math.log(1 - p));
        return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
                ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
    }
};

// z-score → 百分位（Normal CDF, Horner 近似法）
const zscoreToPercentile = (z) => {
    const t = 1 / (1 + 0.2316419 * Math.abs(z));
    const d = 0.3989422804014327; // 1/sqrt(2*pi)
    const p = d * Math.exp(-z * z / 2) *
              (t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))));
    return (z > 0 ? (1 - p) : p) * 100;
};

// 計算 BMI
const calculateBMI = (weight, height) => {
    const heightInMeters = height / 100;
    return parseFloat((weight / (heightInMeters * heightInMeters)).toFixed(1));
};

// 檢測異常
const detectAbnormalities = (measurements, gender, geneticHeightPercentile = null) => {
    const warnings = [];
    
    measurements.forEach((measurement, index) => {
        const issues = [];
        
        // 檢查身高百分位
        if (measurement.heightPercentile.value <= 3 || measurement.heightPercentile.value >= 97) {
            issues.push({
                type: 'height_percentile',
                severity: 'error',
                message: `身高${measurement.heightPercentile.percentile}，需注意`
            });
        }
        
        // 檢查體重百分位
        if (measurement.weightPercentile.value <= 3 || measurement.weightPercentile.value >= 97) {
            issues.push({
                type: 'weight_percentile',
                severity: 'error',
                message: `體重${measurement.weightPercentile.percentile}，需注意`
            });
        }
        
        // 檢查 BMI
        if (measurement.bmiPercentile.value >= 97) {
            issues.push({
                type: 'bmi',
                severity: 'error',
                message: '肥胖：過重與肥胖會增加慢性病風險，也會有成年時期長不高的風險'
            });
        } else if (measurement.bmiPercentile.value >= 85) {
            issues.push({
                type: 'bmi',
                severity: 'warning',
                message: '過重：過重與肥胖會增加慢性病風險，也會有成年時期長不高的風險'
            });
        }
        
        // 檢查基因身高偏差（如果有基因身高資料）
        if (geneticHeightPercentile !== null) {
            const heightPercentileDiff = Math.abs(measurement.heightPercentile.value - geneticHeightPercentile);
            
            if (heightPercentileDiff > 18) {
                const direction = measurement.heightPercentile.value > geneticHeightPercentile ? '高於' : '低於';
                issues.push({
                    type: 'genetic_deviation',
                    severity: 'warning',
                    message: `實際身高百分位${direction}基因預期${heightPercentileDiff.toFixed(1)}%（超過1個標準差），建議評估`
                });
            }
        }
        
        // 檢查生長速度（需要至少兩個測量點）
        if (index > 0) {
            const prevMeasurement = measurements[index - 1];
            const timeDiff = measurement.age - prevMeasurement.age;
            const heightGrowth = measurement.height - prevMeasurement.height;
            const growthRate = heightGrowth / timeDiff;
            
            // 每年生長速度 < 4cm
            if (growthRate < 4) {
                issues.push({
                    type: 'growth_rate',
                    severity: 'error',
                    message: `生長速度過慢（${growthRate.toFixed(1)}公分/年），需注意`
                });
            }
            
            // 青春期前生長過快（需要4歲以後才檢查）
            const isPrepubertal = (gender === 'male' && measurement.age < 12) || 
                                  (gender === 'female' && measurement.age < 10);
            const isOver4YearsOld = measurement.age >= 4;
            
            if (isPrepubertal && isOver4YearsOld && growthRate > 6) {
                issues.push({
                    type: 'growth_rate',
                    severity: 'warning',
                    message: `青春期前生長過快（${growthRate.toFixed(1)}公分/年），建議評估`
                });
            }
        }
        
        if (issues.length > 0) {
            warnings.push({
                index,
                measureDate: measurement.measureDate,
                displayAge: measurement.displayAge,
                issues
            });
        }
    });
    
    return warnings;
};

// ===================== 診間匯入 / 合理性檢查（門診優化擴充） =====================

// base64url <-> UTF-8 JSON。用 hash(#d=) 傳遞，資料不會進伺服器 log。
const encodeState = (obj) => {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    let bin = '';
    bytes.forEach(b => { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};

const decodeState = (b64) => {
    const pad = b64.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(pad + '==='.slice((pad.length + 3) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
};

// 把外部資料收斂成本工具的 formData 形狀，順便擋掉不認識的欄位
const normalizeImport = (raw) => {
    if (!raw || typeof raw !== 'object') throw new Error('資料格式不正確');
    const str = (v) => (v === null || v === undefined) ? '' : String(v).trim();
    const gender = str(raw.gender).toLowerCase();
    const ms = Array.isArray(raw.measurements) ? raw.measurements : [];
    const measurements = ms
        .filter(m => m && (m.measureDate || m.height || m.weight))
        .slice(0, 10)
        .map(m => ({
            measureDate: str(m.measureDate),
            height: str(m.height),
            weight: str(m.weight)
        }));
    return {
        gender: (gender === 'male' || gender === 'female') ? gender : '',
        birthDate: str(raw.birthDate),
        fatherHeight: str(raw.fatherHeight),
        motherHeight: str(raw.motherHeight),
        measurements: measurements.length ? measurements
                                          : [{ measureDate: '', height: '', weight: '' }]
    };
};

// 跨欄位 / 跨時間的合理性檢查。
// validateMeasurement 只看單一欄位範圍，抓不到「身高體重寫反」「身高倒退」
// 「年增速離譜」這類 OCR 誤讀與手誤 —— 這裡補上。
const validatePlausibility = (fd) => {
    const issues = [];
    const label = (i) => '測量數據 ' + (i + 1);

    [['fatherHeight', '父親'], ['motherHeight', '母親']].forEach(([key, who]) => {
        const raw = fd[key];
        if (raw === '' || raw === null || raw === undefined) return;
        const v = parseFloat(raw);
        if (isNaN(v) || v < 130 || v > 220) {
            issues.push(who + '身高 ' + raw + ' 公分不在合理範圍（130–220），請確認');
        }
    });

    const rows = fd.measurements.map((m, i) => ({
        i: i,
        date: m.measureDate,
        h: parseFloat(m.height),
        w: parseFloat(m.weight)
    }));

    const seen = {};
    rows.forEach(r => {
        if (!r.date) return;
        if (seen[r.date]) issues.push('測量日期 ' + r.date + ' 出現超過一次，請確認是否重複輸入');
        seen[r.date] = true;
    });

    rows.forEach(r => {
        if (isNaN(r.h) || isNaN(r.w)) return;
        if (r.w > r.h) {
            issues.push(label(r.i) + '：體重 ' + r.w + ' 大於身高 ' + r.h + '，身高體重是否寫反？');
        }
        const bmi = r.w / Math.pow(r.h / 100, 2);
        if (bmi < 8 || bmi > 50) {
            issues.push(label(r.i) + '：換算 BMI 為 ' + bmi.toFixed(1) +
                        '，超出人類可能範圍（8–50），請確認身高與體重');
        }
    });

    const sorted = rows
        .filter(r => r.date && !isNaN(r.h) && !isNaN(r.w))
        .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

    for (let k = 1; k < sorted.length; k++) {
        const prev = sorted[k - 1];
        const cur = sorted[k];
        const days = (new Date(cur.date) - new Date(prev.date)) / 86400000;
        if (days <= 0) continue;
        const years = days / 365.25;

        // 站姿量測誤差約 1 公分，超過 1.5 公分的倒退幾乎都是輸入錯誤
        if (cur.h < prev.h - 1.5) {
            issues.push(prev.date + ' → ' + cur.date + '：身高從 ' + prev.h +
                        ' 降到 ' + cur.h + ' 公分，身高不會倒退，請確認');
        }
        if (days >= 60) {
            const cmPerYear = (cur.h - prev.h) / years;
            if (cmPerYear > 25) {
                issues.push(prev.date + ' → ' + cur.date + '：身高年增速達 ' +
                            cmPerYear.toFixed(1) + ' 公分/年，超過生理可能，請確認日期與身高');
            }
            const kgPerYear = Math.abs(cur.w - prev.w) / years;
            if (kgPerYear > 30) {
                issues.push(prev.date + ' → ' + cur.date + '：體重年變化達 ' +
                            kgPerYear.toFixed(1) + ' 公斤/年，請確認');
            }
        }
    }

    return issues;
};

            onImport(normalizeImport(JSON.parse(text)));
            setMsg('✅ 已匯入，正在計算…');
        } catch (e) {
            setMsg('❌ 匯入失敗：' + e.message);
        }
    };

    const doLink = async () => {
        const url = buildLink();
        try {
            await navigator.clipboard.writeText(url);
            setMsg('✅ 連結已複製到剪貼簿');
        } catch (e) {
            setText(url);
            setMsg('連結已放到下方欄位，請手動複製');
        }
    };

    return (
        <div className="mb-6">
            <button type="button" onClick={() => setOpen(!open)}
                className="text-sm text-gray-500 hover:text-gray-700 underline">
                {open ? '收合' : '診間工具：貼上資料匯入 / 產生分享連結'}
            </button>
            {open && (
                <div className="mt-2 p-4 border rounded-lg bg-gray-50 space-y-2">
                    <textarea
                        value={text}
                        onChange={(e) => setText(e.target.value)}
                        placeholder='貼上 JSON，例如：{"gender":"male","birthDate":"2019-03-05","measurements":[{"measureDate":"2026-08-22","height":123.5,"weight":24}]}'
                        className="w-full p-2 border rounded font-mono text-xs h-24"
                    />
                    <div className="flex gap-2">
                        <button type="button" onClick={doImport}
                            className="px-3 py-1.5 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">
                            匯入並計算
                        </button>
                        <button type="button" onClick={doLink}
                            className="px-3 py-1.5 bg-gray-600 text-white rounded text-sm hover:bg-gray-700">
                            複製目前資料的連結
                        </button>
                    </div>
                    {msg && <p className="text-sm text-gray-700">{msg}</p>}
                </div>
            )}
        </div>
    );
};

// createSvgTag 會把尺寸寫死成 px，換掉根節點的 width/height 才能同一份 SVG
// 既餵螢幕（px）又餵列印（mm）。內層的 rect/path 沒有 px 單位，不會被誤傷。
const resizeSvgTag = (tag, size) =>
    tag.replace(/width="[0-9]+px"/, 'width="' + size + '"')
       .replace(/height="[0-9]+px"/, 'height="' + size + '"');

// 複診免重填：把「含全部資料的連結」交給病歷註記或兒童手冊，
// 下次點開／掃描就全部帶入，只要補當天一列。
const RevisitPanel = ({ buildLink }) => {
    // 每次 render 重算，連結才會跟著最新的 formData 走（不能在 mount 時快取）
    const url = buildLink();
    const [copied, setCopied] = React.useState(false);
    const [showManual, setShowManual] = React.useState(false);
    const [note, setNote] = React.useState('');

    // 換了病人／改了資料之後，舊的「已複製」提示會誤導人以為手上那份是新的
    React.useEffect(() => {
        setCopied(false);
        setShowManual(false);
        setNote('');
    }, [url]);

    const svgTag = React.useMemo(() => {
        // 離線版 vendor/ 缺檔時優雅降級，其他功能照常
        if (typeof window.qrcode !== 'function') return null;
        try {
            // typeNumber 0 = 自動選型號；連結約 600–1000 字元，'M' 容錯下容量仍然夠
            const qr = window.qrcode(0, 'M');
            qr.addData(url);
            qr.make();
            return qr.createSvgTag({ cellSize: 4, margin: 4 });
        } catch (e) {
            return null;
        }
    }, [url]);

    const displaySvg = React.useMemo(
        () => (svgTag ? resizeSvgTag(svgTag, '180px') : null),
        [svgTag]
    );

    const doCopy = async () => {
        try {
            await navigator.clipboard.writeText(url);
            setCopied(true);
            setShowManual(false);
        } catch (e) {
            // file:// 或非 HTTPS 下沒有 clipboard API，退回讓人自己選取
            setCopied(false);
            setShowManual(true);
        }
    };

    const printSticker = () => {
        if (!svgTag) return;
        // 開新視窗印，而不是在主頁面加全域 @media print：
        // 使用者可能直接 Ctrl+P 想印整份報告，加了規則會把報告蓋掉。
        const w = window.open('', '_blank');
        if (!w) {
            setNote('瀏覽器擋下新視窗，請允許彈出視窗後再試一次。');
            return;
        }
        const today = new Date().toLocaleDateString('zh-TW');
        w.document.write(
            '<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8">' +
            '<title>生長曲線 QR 貼紙</title><style>' +
            'body{margin:0;padding:10mm;text-align:center;' +
            'font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}' +
            '.qr{line-height:0}' +
            '.cap{margin-top:4mm;font-size:11pt}' +
            '.day{margin-top:1mm;font-size:8pt;color:#666}' +
            '</style></head><body>' +
            // 55mm：滿版 10 筆量測時 QR 會到 121 模組，再小下去每個模組不到 0.45mm，
            // 印在紙上手機就掃不動了
            '<div class="qr">' + resizeSvgTag(svgTag, '55mm') + '</div>' +
            '<div class="cap">生長曲線資料・掃描即帶入</div>' +
            '<div class="day">' + today + '</div>' +
            '</body></html>'
        );
        w.document.close();
        w.focus();
        w.print();
    };

    return (
        <div className="p-4 bg-blue-50 rounded-lg">
            <h3 className="font-bold mb-1">複診免重填</h3>
            <p className="text-sm text-gray-700 mb-3">
                把這個連結存進病歷註記，或把 QR 貼在兒童手冊。下次點開／掃描，所有資料自動帶入，只要補當天一列。
            </p>

            <div className="flex flex-wrap gap-2 items-center">
                <button type="button" onClick={doCopy}
                    className="px-3 py-1.5 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">
                    複製複診連結
                </button>
                {svgTag && (
                    <button type="button" onClick={printSticker}
                        className="px-3 py-1.5 bg-gray-600 text-white rounded text-sm hover:bg-gray-700">
                        列印 QR 貼紙
                    </button>
                )}
                {copied && <span className="text-sm text-green-700 font-medium">✅ 已複製</span>}
            </div>

            {showManual && (
                <div className="mt-2">
                    <p className="text-sm text-gray-700 mb-1">無法自動複製，請手動選取下方連結：</p>
                    <input
                        type="text"
                        readOnly
                        value={url}
                        onFocus={(e) => e.target.select()}
                        className="w-full p-2 border rounded font-mono text-xs bg-white"
                    />
                </div>
            )}

            {note && <p className="mt-2 text-sm text-orange-600">{note}</p>}

            <div className="mt-3">
                {displaySvg ? (
                    <div className="inline-block bg-white p-2 rounded border"
                        dangerouslySetInnerHTML={{ __html: displaySvg }} />
                ) : (
                    <p className="text-sm text-gray-500">QR 元件未載入</p>
                )}
            </div>

            <p className="mt-3 text-xs text-gray-500">
                若病歷欄位有字數限制（連結約 600–1000 字），請改用 QR 貼紙。
            </p>
        </div>
    );
};

const GrowthCalculator = () => {
    const [formData, setFormData] = React.useState({
        gender: '',
        birthDate: '',
        fatherHeight: '',
        motherHeight: '',
        measurements: [{ measureDate: '', height: '', weight: '' }]
    });
    
    const [results, setResults] = React.useState(null);
    const [warnings, setWarnings] = React.useState([]);
    const [error, setError] = React.useState('');
    const resultsRef = React.useRef(null);
    const formRef = React.useRef(null);
    const overrideRef = React.useRef(false);
    const [plausibility, setPlausibility] = React.useState([]);
    const [runTick, setRunTick] = React.useState(0);
    const [importNote, setImportNote] = React.useState('');

    // 從網址 hash 匯入（#d=<base64url JSON>）。用 hash 而非 query string，
    // 資料不會被送到伺服器，也不會留在 access log。
    React.useEffect(() => {
        const readHash = () => {
            const m = window.location.hash.match(/(?:^#|&)d=([A-Za-z0-9_-]+)/);
            if (!m) return;
            try {
                const data = normalizeImport(decodeState(m[1]));
                setFormData(data);
                setResults(null);
                setWarnings([]);
                setError('');
                setPlausibility([]);
                setImportNote('已從連結帶入資料，請核對後確認。');
                setRunTick(t => t + 1);
            } catch (e) {
                setError('連結資料匯入失敗，請手動輸入（' + e.message + '）');
            }
        };
        readHash();
        // 同一個分頁換上新的 #d= 連結時，瀏覽器只換 fragment、不會重新載入頁面。
        // 不聽 hashchange 的話，畫面會停留在上一位病人的資料 —— 在門診是危險的。
        window.addEventListener('hashchange', readHash);
        return () => window.removeEventListener('hashchange', readHash);
    }, []);

    // 匯入或「仍要計算」之後，觸發一次正式送出
    React.useEffect(() => {
        if (runTick > 0 && formRef.current) formRef.current.requestSubmit();
    }, [runTick]);

    const importData = (data) => {
        setFormData(data);
        setError('');
        setPlausibility([]);
        setImportNote('已匯入資料，請核對後確認。');
        setRunTick(t => t + 1);
    };

    // 用 href 去掉 hash 當基底：file:// 下 origin 會是 "file://" 或 "null"，用 origin+pathname 會產生壞連結
    const buildShareLink = () =>
        window.location.href.split('#')[0] + '#d=' + encodeState(formData);


    const addMeasurement = () => {
        if (formData.measurements.length >= 10) {
            setError('最多只能添加10組測量數據');
            return;
        }
        setFormData({
            ...formData,
            measurements: [...formData.measurements, { measureDate: '', height: '', weight: '' }]
        });
    };

    const removeMeasurement = (index) => {
        if (formData.measurements.length === 1) {
            setError('至少需要保留1組數據');
            return;
        }
        const newMeasurements = formData.measurements.filter((_, i) => i !== index);
        setFormData({ ...formData, measurements: newMeasurements });
    };

    const handleInputChange = (index, field, value) => {
        const newMeasurements = [...formData.measurements];
        newMeasurements[index] = { ...newMeasurements[index], [field]: value };
        setFormData({ ...formData, measurements: newMeasurements });
    };

    const handleSubmit = (e) => {
        e.preventDefault();
        setError('');

        if (!formData.gender) {
            setError('請選擇性別');
            return;
        }

        if (!formData.birthDate) {
            setError('請輸入出生日期');
            return;
        }

        // 合理性檢查：有疑點就先擋下來讓人確認，確認後才放行
        const skipPlausibility = overrideRef.current;
        overrideRef.current = false;
        const plausibilityIssues = validatePlausibility(formData);
        if (plausibilityIssues.length > 0 && !skipPlausibility) {
            setPlausibility(plausibilityIssues);
            setResults(null);
            return;
        }
        setPlausibility([]);

        try {
            const processedMeasurements = formData.measurements.map(measurement => {
                const { measureDate, height, weight } = measurement;
                
                validateMeasurement(formData.birthDate, measureDate, height, weight);

                const ageData = calculateAge(formData.birthDate, measureDate);
                const age = ageData.decimalAge;
                const bmi = calculateBMI(parseFloat(weight), parseFloat(height));

                return {
                    measureDate,
                    age,
                    height: parseFloat(height),
                    weight: parseFloat(weight),
                    bmi,
                    displayAge: `${ageData.years}歲${ageData.months}個月`,
                    heightPercentile: calculatePercentile(parseFloat(height), age, 'height', formData.gender),
                    weightPercentile: calculatePercentile(parseFloat(weight), age, 'weight', formData.gender),
                    bmiPercentile: calculatePercentile(bmi, age, 'bmi', formData.gender)
                };
            });

            processedMeasurements.sort((a, b) => new Date(a.measureDate) - new Date(b.measureDate));

            // 計算基因身高
            let geneticHeightCurve = null;
            let geneticHeightInfo = null;
            let geneticHeightPercentile = null;
            
            if (formData.fatherHeight && formData.motherHeight) {
                const fatherH = parseFloat(formData.fatherHeight);
                const motherH = parseFloat(formData.motherHeight);
                
                if (!isNaN(fatherH) && !isNaN(motherH) && fatherH > 0 && motherH > 0) {
                    const avgHeight = (fatherH + motherH) / 2;
                    const expectedHeight = formData.gender === 'male' ? avgHeight + 6 : avgHeight - 6;

                    // 在18歲時找出對應的百分位
                    const percentileAt18 = calculatePercentileValue(expectedHeight, 18, formData.gender);
                    geneticHeightPercentile = percentileAt18;

                    // 生成整條基因身高曲線（中間值）
                    geneticHeightCurve = generateHeightCurveByPercentile(percentileAt18, formData.gender);

                    // ===== 用 z-score 計算正確的 ±1 SD 範圍 =====
                    // 1. 將基因預期身高的百分位轉為 z-score
                    const zGenetic = percentileToZscore(percentileAt18);
                    // 2. z ± 1 得到上下界的 z-score
                    const zUpper = zGenetic + 1;
                    const zLower = zGenetic - 1;
                    // 3. 轉回百分位
                    const upperPercentile = Math.max(1, Math.min(99, zscoreToPercentile(zUpper)));
                    const lowerPercentile = Math.max(1, Math.min(99, zscoreToPercentile(zLower)));
                    // 4. 生成上下界曲線
                    const geneticUpperCurve = generateHeightCurveByPercentile(upperPercentile, formData.gender);
                    const geneticLowerCurve = generateHeightCurveByPercentile(lowerPercentile, formData.gender);

                    // 把上下界附加到 geneticHeightCurve 物件上
                    geneticHeightCurve._upper = geneticUpperCurve;
                    geneticHeightCurve._lower = geneticLowerCurve;

                    // 計算 18 歲時 ±1SD 實際對應的 cm 範圍（用於顯示）
                    const upperHeightAt18 = geneticUpperCurve[geneticUpperCurve.length - 1].y;
                    const lowerHeightAt18 = geneticLowerCurve[geneticLowerCurve.length - 1].y;
                    const sdInCm = ((upperHeightAt18 - lowerHeightAt18) / 2).toFixed(1);

                    geneticHeightInfo = {
                        expectedHeight: expectedHeight.toFixed(1),
                        percentile: percentileAt18.toFixed(1),
                        upperPercentile: upperPercentile.toFixed(1),
                        lowerPercentile: lowerPercentile.toFixed(1),
                        sdInCm: sdInCm
                    };
                }
            }

            // 檢測異常（包含基因身高偏差檢查）
            const detectedWarnings = detectAbnormalities(
                processedMeasurements, 
                formData.gender, 
                geneticHeightPercentile
            );

            setResults({
                measurements: processedMeasurements,
                heightData: createChartData('height', formData.gender, geneticHeightCurve),
                weightData: createChartData('weight', formData.gender),
                geneticHeightInfo: geneticHeightInfo
            });
            
            setWarnings(detectedWarnings);
        } catch (err) {
            setError(err.message);
        }
    };

    return (
        <div className="max-w-6xl mx-auto p-6">
            <h1 className="text-3xl font-bold text-center mb-8">兒童生長評估計算器（含異常檢測）</h1>

            <ImportPanel onImport={importData} buildLink={buildShareLink} />

            {importNote && (
                <div className="mb-4 p-3 bg-green-50 border border-green-300 text-green-800 rounded-lg text-sm">
                    {importNote}
                </div>
            )}
            
            <form ref={formRef} onSubmit={handleSubmit} className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="space-y-2">
                        <label className="block font-medium">性別：</label>
                        <div className="flex gap-4">
                            <label className="flex items-center cursor-pointer">
                                <input
                                    type="radio"
                                    value="male"
                                    checked={formData.gender === 'male'}
                                    onChange={(e) => setFormData({...formData, gender: e.target.value})}
                                    className="mr-2"
                                />
                                男生
                            </label>
                            <label className="flex items-center cursor-pointer">
                                <input
                                    type="radio"
                                    value="female"
                                    checked={formData.gender === 'female'}
                                    onChange={(e) => setFormData({...formData, gender: e.target.value})}
                                    className="mr-2"
                                />
                                女生
                            </label>
                        </div>
                    </div>

                    <div className="space-y-2">
                        <label className="block font-medium">出生日期：</label>
                        <input
                            type="date"
                            value={formData.birthDate}
                            onChange={(e) => setFormData({...formData, birthDate: e.target.value})}
                            className="w-full p-2 border rounded"
                        />
                    </div>
                </div>

                {/* 父母身高區域（選填） */}
                <div className="p-4 bg-blue-50 rounded-lg">
                    <h3 className="font-medium mb-3">基因身高計算（選填）</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-2">
                            <label className="block font-medium">父親身高 (cm)：</label>
                            <input
                                type="number"
                                step="0.1"
                                value={formData.fatherHeight}
                                onChange={(e) => setFormData({...formData, fatherHeight: e.target.value})}
                                placeholder="例如：175"
                                className="w-full p-2 border rounded"
                            />
                        </div>
                        <div className="space-y-2">
                            <label className="block font-medium">母親身高 (cm)：</label>
                            <input
                                type="number"
                                step="0.1"
                                value={formData.motherHeight}
                                onChange={(e) => setFormData({...formData, motherHeight: e.target.value})}
                                placeholder="例如：162"
                                className="w-full p-2 border rounded"
                            />
                        </div>
                    </div>
                    <p className="text-sm text-gray-600 mt-2">
                        💡 填寫父母身高後，將在身高生長曲線上顯示基因預期身高（淡藍色虛線）
                    </p>
                </div>

                <div className="space-y-4">
                    {formData.measurements.map((measurement, index) => (
                        <MeasurementInput
                            key={index}
                            data={measurement}
                            index={index}
                            onChange={(field, value) => handleInputChange(index, field, value)}
                            onRemove={() => removeMeasurement(index)}
                            isRemovable={formData.measurements.length > 1}
                        />
                    ))}
                </div>

                {formData.measurements.length < 10 && (
                    <button
                        type="button"
                        onClick={addMeasurement}
                        className="flex items-center gap-2 text-blue-600 hover:text-blue-800 transition-colors"
                    >
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" 
                             stroke="currentColor" strokeWidth="2" 
                             strokeLinecap="round" strokeLinejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        添加測量數據
                    </button>
                )}

                <button
                    type="submit"
                    className="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 
                             transition-colors font-medium"
                >
                    計算評估結果
                </button>
            </form>

            {error && (
                <div className="mt-4 p-4 bg-red-100 text-red-700 rounded-lg">
                    {error}
                </div>
            )}

            {plausibility.length > 0 && (
                <div className="mt-4 p-4 bg-amber-50 border-2 border-amber-400 rounded-lg">
                    <h3 className="font-bold text-amber-900 mb-2">
                        ⚠️ 資料看起來有問題，請先確認
                    </h3>
                    <ul className="list-disc list-inside text-amber-900 space-y-1 text-sm">
                        {plausibility.map((issue, i) => <li key={i}>{issue}</li>)}
                    </ul>
                    <p className="text-xs text-amber-800 mt-3">
                        這些是常見的輸入錯誤或辨識誤讀。請回上方修正；
                        若確認資料無誤（例如久未回診、量測方式改變），可直接繼續。
                    </p>
                    <button
                        type="button"
                        onClick={() => { overrideRef.current = true; setRunTick(t => t + 1); }}
                        className="mt-3 px-4 py-2 bg-amber-600 text-white rounded hover:bg-amber-700 text-sm"
                    >
                        我已確認資料無誤，仍要計算
                    </button>
                </div>
            )}

            {results && (
                <div className="mt-8 space-y-8">
                    {/* 匯出按鈕列 */}
                    <ExportButtons resultsRef={resultsRef} />

                    {/* 複診免重填：連結 + QR 貼紙。放在 resultsRef 外面，
                        才不會被 html2canvas 一起截進報告圖裡。 */}
                    <RevisitPanel buildLink={buildShareLink} />

                    {/* 可匯出的結果區塊 */}
                    <div ref={resultsRef} className="space-y-8 bg-white p-2">
                    {warnings.length > 0 && (
                        <div className="p-6 bg-red-50 border-2 border-red-300 rounded-lg">
                            <h3 className="text-xl font-bold text-red-700 mb-4">⚠️ 發現異常狀況</h3>
                            <div className="space-y-4">
                                {warnings.map((warning, index) => (
                                    <div key={index} className="bg-white p-4 rounded border border-red-200">
                                        <div className="font-bold text-red-700 mb-2">
                                            {warning.displayAge} ({formatDate(warning.measureDate)})
                                        </div>
                                        <ul className="space-y-1">
                                            {warning.issues.map((issue, i) => (
                                                <li
                                                    key={i}
                                                    className={`${
                                                        issue.severity === 'error'
                                                            ? 'text-red-600 font-bold'
                                                            : 'text-orange-600'
                                                    }`}
                                                >
                                                    {issue.severity === 'error' ? '🚨' : '⚠️'} {issue.message}
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    
                    {/* 基因身高資訊 */}
                    {results.geneticHeightInfo && (
                        <div className="p-6 bg-blue-50 border-2 border-blue-300 rounded-lg">
                            <h3 className="text-xl font-bold text-blue-700 mb-4">🧬 基因預期身高</h3>
                            <div className="bg-white p-4 rounded">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <span className="text-gray-600">預期身高（18歲）：</span>
                                        <span className="text-2xl font-bold text-blue-700 ml-2">
                                            {results.geneticHeightInfo.expectedHeight} ± {results.geneticHeightInfo.sdInCm} cm
                                        </span>
                                    </div>
                                    <div>
                                        <span className="text-gray-600">對應百分位：</span>
                                        <span className="text-2xl font-bold text-blue-700 ml-2">
                                            {results.geneticHeightInfo.percentile}%
                                        </span>
                                    </div>
                                </div>
                                <div className="mt-3 p-3 bg-blue-50 rounded text-sm text-gray-700">
                                    <p>
                                        💡 圖表中的<strong>藍色虛線</strong>為基因預期身高，
                                        <strong>淡藍色範圍帶</strong>為 ±1 個標準差
                                        （18 歲時約 ±{results.geneticHeightInfo.sdInCm} cm，
                                        對應百分位 P{results.geneticHeightInfo.lowerPercentile} ~ P{results.geneticHeightInfo.upperPercentile}）
                                    </p>
                                </div>
                                <p className="text-sm text-orange-600 font-medium mt-2">
                                    ⚠️ 此乃推估值，僅供參考
                                </p>
                            </div>
                        </div>
                    )}
                    
                    <ResultsTable results={results} warnings={warnings} />
                    
                    <GrowthChart
                        data={results.heightData}
                        measurements={results.measurements}
                        type="height"
                        title="身高生長曲線"
                        yAxisLabel="身高 (cm)"
                    />
                    
                    <GrowthChart
                        data={results.weightData}
                        measurements={results.measurements}
                        type="weight"
                        title="體重生長曲線"
                        yAxisLabel="體重 (kg)"
                    />

                    <div className="p-4 bg-blue-50 rounded-lg">
                        <h3 className="font-bold mb-2">評估說明：</h3>
                        <ul className="list-disc list-inside space-y-1">
                            <li>百分位數值代表在同年齡同性別群體中的相對位置</li>
                            <li><span className="text-red-600 font-bold">異常標準（紅燈）：</span></li>
                            <ul className="list-disc list-inside ml-6 space-y-1">
                                <li>身高或體重 &lt;3% 或 &gt;97%</li>
                                <li>每年生長速度 &lt;4公分</li>
                                <li>BMI &gt;97% (肥胖)</li>
                            </ul>
                            <li><span className="text-orange-600 font-bold">需注意（黃燈）：</span></li>
                            <ul className="list-disc list-inside ml-6 space-y-1">
                                <li>4歲後，青春期前生長過快（男生12歲前、女生10歲前每年&gt;6公分）</li>
                                <li>BMI 85-97% (過重)</li>
                            </ul>
                            <li>第3-15百分位：略低</li>
                            <li>第15-85百分位：正常範圍</li>
                            <li>第85-97百分位：略高</li>
                        </ul>
                    </div>
                    {/* 情境化「下一步行動」CTA */}
                    <ContextualCTA
                        warnings={warnings}
                        results={results}
                        gender={formData.gender}
                    />

                    </div>{/* end of resultsRef */}

                    {/* LINE 官方帳號導流 CTA */}
                    <LineCTA />

                    {/* 再次顯示匯出按鈕（結果很長時方便底部使用） */}
                    <ExportButtons resultsRef={resultsRef} />
                </div>
            )}
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<GrowthCalculator />);

    </script>
</body>
</html>
